[workspace]
resolver = "2"
members = [
    "crates/xstate-rt",
    "crates/xstate-wasm",
    "crates/xstate-codegen",
    "crates/xstate-wasi",
    "crates/xstate-wasi-host",
    "crates/xstate-wasi-guest",
    "crates/xstate-kafka",
    "crates/xstate-node",
    "examples/checkout",
    "examples/checkout-component",
]
# xstate-wasi-host builds Wasmtime; test it explicitly with `cargo test -p xstate-wasi-host`.
# xstate-node is a Node.js addon; build and test it with `crates/xstate-node/build.sh` and
# `node --test crates/xstate-node/test.mjs`.
default-members = [
    "crates/xstate-rt",
    "crates/xstate-wasm",
    "crates/xstate-codegen",
    "crates/xstate-wasi",
    "crates/xstate-wasi-guest",
    "crates/xstate-kafka",
    "examples/checkout",
    "examples/checkout-component",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/wetryfun/xstate-rs"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
