[workspace]
resolver = "2"
members = [
    "crates/xstate-rt",
    "crates/xstate-wasm",
    "crates/xstate-codegen",
    "crates/xstate-wasi",
    "crates/xstate-wasi-host",
    "crates/xstate-redpanda",
    "examples/checkout",
]
# xstate-wasi-host builds Wasmtime; test it explicitly with `cargo test -p xstate-wasi-host`.
default-members = [
    "crates/xstate-rt",
    "crates/xstate-wasm",
    "crates/xstate-codegen",
    "crates/xstate-wasi",
    "crates/xstate-redpanda",
    "examples/checkout",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/wetryfun/xstate-rs"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
