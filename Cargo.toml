[workspace]
resolver = "2"
members = ["crates/xstate-rt", "crates/xstate-wasm"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/wetryfun/xstate-rs"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
