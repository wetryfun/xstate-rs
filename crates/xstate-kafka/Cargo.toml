[package]
name = "xstate-kafka"
version = "0.1.0"
description = "Runs XState machines as partition-sharded actors next to a Kafka-API broker, with exactly-once state"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# The Kafka driver (librdkafka, built from source).
kafka = ["dep:rdkafka", "dep:ctrlc", "dep:mimalloc"]

[dependencies]
xstate-rt = { path = "../xstate-rt" }
serde.workspace = true
serde_json.workspace = true
rmp-serde = "1.3"
foldhash = "0.2"
rdkafka = { version = "0.39", default-features = false, optional = true }
ctrlc = { version = "3.5", optional = true, features = ["termination"] }
# The binary's allocator: allocation is a large share of each event.
mimalloc = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
mimalloc = { version = "0.1", default-features = false }
prost = "0.13"

[[bench]]
name = "engine"
harness = false

[[bin]]
name = "xstate-kafka"
required-features = ["kafka"]

[[example]]
name = "mock_throughput"
required-features = ["kafka"]
