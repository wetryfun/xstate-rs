[package]
name = "xstate-kafka"
version = "0.1.0"
description = "Runs XState machines as partition-sharded actors next to a Kafka-API broker, with exactly-once state"
edition.workspace = true
license.workspace = true
repository.workspace = true
# apache-avro 0.20+ needs 1.85 (0.19 enabled serde_json's
# `arbitrary_precision` for the whole build); the core keeps the workspace's.
rust-version = "1.85"
publish = false

[features]
default = []
# The Kafka driver (librdkafka, built from source), with TLS (OpenSSL built
# in, so the binary needs no system libssl), SASL PLAIN / SCRAM /
# OAUTHBEARER (built into librdkafka with TLS), and zstd and gzip
# compression (lz4 and snappy are built in).
kafka = [
    "dep:rdkafka",
    "dep:ctrlc",
    "dep:mimalloc",
    "dep:ureq",
    "rdkafka/ssl-vendored",
    "rdkafka/zstd",
    "rdkafka/libz-static",
]
# SASL GSSAPI (Kerberos), through the system's Cyrus SASL (libsasl2-dev).
kafka-gssapi = ["kafka", "rdkafka/gssapi"]
# JavaScript code nodes (`@lang` `js` and `ts`) in the generic binary's
# machines, run by an embedded QuickJS (xstate-js; Rust 1.87).
js = ["dep:xstate-js"]

[dependencies]
xstate-rt = { path = "../xstate-rt" }
xstate-js = { path = "../xstate-js", optional = true }
serde.workspace = true
serde_json.workspace = true
rmp-serde = "1.3"
foldhash = "0.2"
rdkafka = { version = "0.39", default-features = false, optional = true }
ctrlc = { version = "3.5", optional = true, features = ["termination"] }
# The binary's allocator: allocation is a large share of each event.
mimalloc = { version = "0.1", optional = true, default-features = false }
# Avro events, outputs and snapshots (Schema Registry wire format).
apache-avro = { version = "0.21", default-features = false }
# The Schema Registry client (blocking HTTP, rustls).
ureq = { version = "3.2.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
mimalloc = { version = "0.1", default-features = false }
prost = "0.13"

[[bench]]
name = "engine"
harness = false

[[bin]]
name = "xstate-kafka"
required-features = ["kafka"]

[[example]]
name = "mock_throughput"
required-features = ["kafka"]

[[example]]
name = "effects_worker"
required-features = ["kafka"]

[[example]]
name = "mock_cluster"
required-features = ["kafka"]
