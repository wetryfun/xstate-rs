[package]
name = "xstate-rt"
version = "0.1.0"
description = "Rust runtime for XState v6 machine definitions (JSON), with Rust guards and actions"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap = { version = "2", features = ["serde"] }
erased-serde = "0.4"

[features]
# Count runtime operations per thread (`xstate_rt::ops`), for the cost model.
op-counts = []

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "interpreter"
harness = false

[[bench]]
name = "examples"
harness = false

[[example]]
name = "cost_model"
required-features = ["op-counts"]
